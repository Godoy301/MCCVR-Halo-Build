name: Compile latest two-handed-grip commit

on:
  push:
    branches:
      - two-handed-grip
    paths:
      - .github/workflows/compile-two-handed-grip.yml

permissions:
  contents: read

concurrency:
  group: mccvr-two-handed-grip-only
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out the source commit from two-handed-grip
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.before }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the branch and exact source commit
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.before }}
        run: |
          if ($env:GITHUB_REF_NAME -ne 'two-handed-grip') {
            throw "Refusing to build unexpected branch: $env:GITHUB_REF_NAME"
          }
          $expectedSourceSha = '876af040e1d0e13a96dcde232f914437673c2d19'
          if ($env:EXPECTED_SOURCE_SHA -ne $expectedSourceSha) {
            throw "Source revision differs from the reviewed two-handed-grip commit. Expected $expectedSourceSha, got $env:EXPECTED_SOURCE_SHA. Refusing to build a different revision."
          }
          $actual = (& git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SOURCE_SHA) {
            throw "Checkout SHA mismatch. Expected $env:EXPECTED_SOURCE_SHA, got $actual"
          }
          $baselineSha = '6e13ded07d7e6d93f3ef5a10a8eb9a6c01d07767'
          git merge-base --is-ancestor $baselineSha $actual
          if ($LASTEXITCODE -ne 0) {
            throw "Refusing to build a source commit that does not descend from the accepted baseline $baselineSha."
          }
          Write-Host "Requested branch: two-handed-grip"
          Write-Host "Exact source commit being built: $actual"
          Write-Host "The main and compilation-test branches are not used as source."

      - name: Verify authored Halo 3 grip acquisition source
        shell: pwsh
        run: |
          $logic = Get-Content 'src/common/authored_grab_zone.h' -Raw
          $game = Get-Content 'src/dll/game.cpp' -Raw
          $vr = Get-Content 'src/dll/vr.cpp' -Raw
          $cmake = Get-Content 'CMakeLists.txt' -Raw
          $test = Get-Content 'tests/authored_grab_zone_tests.cpp' -Raw
          if (-not $logic.Contains('struct Learner') -or -not $logic.Contains('struct Publication')) {
            throw "This source is missing the authored-grip learner/publication logic."
          }
          if (-not $game.Contains('PublishH3AuthoredGrab') -or
              -not $vr.Contains('AuthoredSupportGrabHit')) {
            throw "The Halo 3 authored wrist acquisition adapter is incomplete."
          }
          if (-not $cmake.Contains('authored_grab_zone_tests') -or
              -not $test.Contains('Publication pub')) {
            throw "The authored-grip zone test is not registered in this source."
          }

      - name: Set up Python for test generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Populate the exact dependency commits pinned by this source
        shell: pwsh
        run: |
          $dependencies = @(
            @{ Name = 'openxr'; Url = 'https://github.com/KhronosGroup/OpenXR-SDK.git'; Sha = '5267613edf3d937e3d77556a106a65c2f82b25c6' },
            @{ Name = 'minhook'; Url = 'https://github.com/TsudaKageyu/minhook.git'; Sha = 'c3fcafdc10146beb5919319d0683e44e3c30d537' },
            @{ Name = 'imgui'; Url = 'https://github.com/ocornut/imgui.git'; Sha = '8936b58fe26e8c3da834b8f60b06511d537b4c63' }
          )
          New-Item -ItemType Directory -Force 'out/deps' | Out-Null
          foreach ($dependency in $dependencies) {
            $path = "out/deps/$($dependency.Name)-src"
            git clone --quiet --filter=blob:none --depth 1 --no-checkout $dependency.Url $path
            if ($LASTEXITCODE -ne 0) { throw "Could not clone $($dependency.Name)." }
            git -C $path fetch --quiet --depth 1 origin $dependency.Sha
            if ($LASTEXITCODE -ne 0) { throw "Could not fetch pinned $($dependency.Name) commit." }
            git -C $path checkout --quiet --detach $dependency.Sha
            if ($LASTEXITCODE -ne 0) { throw "Could not check out pinned $($dependency.Name) commit." }
          }

      - name: Show Windows build toolchain
        shell: pwsh
        run: |
          cmake --version
          python --version
          git --version

      - name: Clean build, run tests, and package the exact two-handed-grip source
        shell: pwsh
        run: .\\tools\\package-candidate.ps1 -Clean

      - name: Verify package files and record source identity
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.before }}
        run: |
          $builds = @(Get-ChildItem 'out/candidates' -Filter '*-Build.zip' -File)
          $sources = @(Get-ChildItem 'out/candidates' -Filter '*-Source.zip' -File)
          $checksums = @(Get-ChildItem 'out/candidates' -Filter '*-SHA256.txt' -File)
          if ($builds.Count -ne 1 -or $sources.Count -ne 1 -or $checksums.Count -ne 1) {
            throw "Expected one build ZIP, one source ZIP, and one checksum file. Found builds=$($builds.Count), sources=$($sources.Count), checksums=$($checksums.Count)."
          }
          $checksumText = Get-Content $checksums[0].FullName -Raw
          if ($checksumText -notmatch [regex]::Escape($env:EXPECTED_SOURCE_SHA)) {
            throw "The package checksum receipt does not identify expected two-handed-grip commit $env:EXPECTED_SOURCE_SHA."
          }
          @"
          Source branch: two-handed-grip
          Exact source commit: $env:EXPECTED_SOURCE_SHA
          Change under test: exact latest two-handed-grip commit, including expanded authored grip zones and suppressed side-by-side aim influence.
          Includes: owner/weapon/generation-qualified publication, preserved settled endpoint during attached animation, no barrel-zone fallback for supported owners while pending, 54 cm authored forward capsule with 12 cm radius, expanded short-grip bounds, primary-local lateral directional authority, and distance-based close-hand aim blending with Virtual Stock on/off.
          Windows build/test validation is performed by this workflow. Headset behavior remains a separate validation.
          Use the Build ZIP from this artifact, not one from a different workflow run.
          "@ | Set-Content 'out/candidates/BUILD-IDENTITY.txt'
          Write-Host "Source branch: two-handed-grip"
          Write-Host "Source commit: $env:EXPECTED_SOURCE_SHA"
          Get-FileHash $builds[0].FullName -Algorithm SHA256
          Get-FileHash $sources[0].FullName -Algorithm SHA256
          Get-Content $checksums[0].FullName

      - name: Upload two-handed-grip build and matching source
        uses: actions/upload-artifact@v4
        with:
          name: MCCVR-two-handed-grip-${{ github.event.before }}
          path: |
            out/candidates/*-Build.zip
            out/candidates/*-Source.zip
            out/candidates/*-SHA256.txt
            out/candidates/BUILD-IDENTITY.txt
          if-no-files-found: error
          retention-days: 14
